name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -v
      - run: node --check web/js/app.js
      - run: node --check web/js/treemap.js
      - run: node --check web/js/wiki.js
      - run: node --check web/js/wiki-metrics.js
      - run: node --check bin/cli.js
